name: Build Aseprite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Aseprite for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            git \
            curl \
            jq \
            unzip \
            p7zip-full \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwebp-dev

      - name: Find latest Aseprite release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(curl -fsSL \
            https://api.github.com/repos/aseprite/aseprite/releases/latest \
            | jq -r '.tag_name')"

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "Could not determine latest Aseprite release."
            exit 1
          fi

          echo "Building Aseprite $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Aseprite source
        run: |
          git clone \
            --recursive \
            --branch "${{ steps.release.outputs.tag }}" \
            https://github.com/aseprite/aseprite.git

      - name: Build Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          ./build.sh --auto --norun

      - name: Show unstripped size
        working-directory: aseprite
        run: |
          ls -lh build/bin/aseprite
          file build/bin/aseprite

      - name: Strip debug information
        working-directory: aseprite
        run: |
          set -euo pipefail

          strip --strip-unneeded build/bin/aseprite

          echo "Stripped Aseprite:"
          ls -lh build/bin/aseprite
          file build/bin/aseprite

      - name: Create portable package
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package
          mkdir -p package

          cp build/bin/aseprite package/aseprite
          cp -r build/bin/data package/data

          printf '%s\n' '# Portable Aseprite' > package/aseprite.ini

          chmod +x package/aseprite

      - name: Create ZIP
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          7z a \
            -tzip \
            -mx=9 \
            "Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip" \
            package/*

          echo "Final package:"
          ls -lh "Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Aseprite ${{ steps.release.outputs.tag }}
          body: |
            Aseprite Linux x64 build compiled from the official Aseprite source.

            Build:
            - Official Aseprite build.sh
            - Precompiled Skia selected by Aseprite
            - RelWithDebInfo build configuration
            - Debug symbols stripped for distribution
            - Linux x86-64
          files: |
            aseprite/Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip
          overwrite_files: true
