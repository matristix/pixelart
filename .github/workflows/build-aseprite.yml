name: Build and release Aseprite

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Aseprite for Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Find latest Aseprite release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y jq curl

          TAG="$(curl -fsSL https://api.github.com/repos/aseprite/aseprite/releases/latest | jq -r '.tag_name')"

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "Could not determine latest Aseprite release."
            exit 1
          fi

          echo "Latest Aseprite release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download Aseprite
        run: |
          git clone \
            --recursive \
            --branch "${{ steps.release.outputs.tag }}" \
            https://github.com/aseprite/aseprite.git

      - name: Install dependencies
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y \
            g++ \
            clang \
            cmake \
            ninja-build \
            unzip \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libwebp-dev

      - name: Build Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          ./build.sh --auto --norun

      - name: Find built Aseprite
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          find . -type f -name aseprite -executable -print

      - name: Create portable package
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          BUILD_DIR="build"

          if [[ ! -x "$BUILD_DIR/bin/aseprite" ]]; then
            echo "Aseprite binary not found at $BUILD_DIR/bin/aseprite"
            exit 1
          fi

          rm -rf package
          mkdir -p package

          cp "$BUILD_DIR/bin/aseprite" package/aseprite
          cp -r "$BUILD_DIR/bin/data" package/data

          printf '%s\n' '# Portable Aseprite' > package/aseprite.ini

          chmod +x package/aseprite

      - name: Create ZIP
        working-directory: aseprite
        shell: bash
        run: |
          set -euo pipefail

          7z a \
            -tzip \
            -mx=9 \
            "Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip" \
            package/*

          ls -lh "Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Aseprite ${{ steps.release.outputs.tag }}
          body: |
            Aseprite Linux x64 build compiled from the official Aseprite source.

            Build configuration:
            - Linux x64
            - Clang
            - libstdc++
            - Precompiled Skia
            - RelWithDebInfo

          files: |
            aseprite/Aseprite-${{ steps.release.outputs.tag }}-Linux-x64.zip
          overwrite_files: true
