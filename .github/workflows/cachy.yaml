name: Build Aseprite

on:
workflow_dispatch:

permissions:
contents: write

jobs:
get-release:
name: Find latest Aseprite release
runs-on: ubuntu-latest
outputs:
tag: ${{ steps.release.outputs.tag }}

steps:
  - name: Find latest release
    id: release
    shell: bash
    run: |
      set -euo pipefail

      release_json="$(curl -fsSL https://api.github.com/repos/aseprite/aseprite/releases/latest)"

      tag="$(echo "$release_json" | jq -r '.tag_name')"

      if [[ -z "$tag" || "$tag" == "null" ]]; then
        echo "Could not determine latest Aseprite release"
        exit 1
      fi

      echo "Latest Aseprite release: $tag"
      echo "tag=$tag" >> "$GITHUB_OUTPUT"


build:
name: Build Aseprite for Linux
needs: get-release
runs-on: ubuntu-latest

steps:
  - name: Install dependencies
    shell: bash
    run: |
      set -euo pipefail

      sudo apt-get update -qq

      sudo apt-get install -y \
        build-essential \
        cmake \
        git \
        ninja-build \
        wget \
        unzip \
        p7zip-full \
        libpixman-1-dev \
        libfreetype6-dev \
        libharfbuzz-dev \
        zlib1g-dev \
        libx11-dev \
        libxcursor-dev \
        libxi-dev \
        libxrandr-dev \
        libgl1-mesa-dev \
        libfontconfig1-dev

  - name: Checkout Aseprite
    shell: bash
    run: |
      set -euo pipefail

      git clone \
        --recurse-submodules \
        -j8 \
        --branch "${{ needs.get-release.outputs.tag }}" \
        https://github.com/aseprite/aseprite.git

  - name: Download Skia
    working-directory: aseprite
    shell: bash
    run: |
      set -euo pipefail

      wget -q \
        https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip \
        -O Skia-Linux-Release-x64.zip

      mkdir -p skia

      unzip -q Skia-Linux-Release-x64.zip -d skia

  - name: Install Ninja
    uses: aseprite/get-ninja@main

  - name: Configure
    working-directory: aseprite
    shell: bash
    run: |
      set -euo pipefail

      export enable_ccache=off
      export laf_backend=skia
      export enable_scripting=on

      cmake \
        -S . \
        -B build \
        -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
        -DENABLE_TESTS=OFF \
        -DENABLE_SCRIPTING="$enable_scripting" \
        -DENABLE_CCACHE="$enable_ccache" \
        -DLAF_BACKEND="$laf_backend" \
        -DSKIA_DIR="$(realpath skia)" \
        -DOPENSSL_USE_STATIC_LIBS=ON \
        -DSKIA_LIBRARY_DIR="$(realpath skia/out/Release-x64)"

  - name: Compile
    working-directory: aseprite
    shell: bash
    run: |
      set -euo pipefail

      ninja -C build

  - name: Prepare portable package
    working-directory: aseprite/build/bin
    shell: bash
    run: |
      set -euo pipefail

      # Keep only the files required to run Aseprite.
      find . -mindepth 1 \
        ! -name 'aseprite' \
        ! -name 'data' \
        ! -name 'aseprite.ini' \
        -exec rm -rf {} +

      # Tell Aseprite to use its own directory as the portable location.
      echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini

  - name: Create ZIP
    working-directory: aseprite/build/bin
    shell: bash
    run: |
      set -euo pipefail

      VERSION="${{ needs.get-release.outputs.tag }}"

      7z -tzip a \
        "Aseprite-${VERSION}-Linux-x64.zip" \
        *

  - name: Create GitHub Release
    uses: softprops/action-gh-release@v2
    with:
      tag_name: ${{ needs.get-release.outputs.tag }}
      name: Aseprite ${{ needs.get-release.outputs.tag }}
      body: |
        Automatically compiled Linux x64 build of Aseprite.

        Source:
        https://github.com/aseprite/aseprite/releases/tag/${{ needs.get-release.outputs.tag }}

        Built by GitHub Actions.
      files: |
        aseprite/build/bin/Aseprite-${{ needs.get-release.outputs.tag }}-Linux-x64.zip
      overwrite_files: true
