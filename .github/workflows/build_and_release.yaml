name: Build Aseprite v1.3.18.6 (Arch/CachyOS)

on:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  ASEPRITE_VERSION: v1.3.18.6

jobs:
  build-aseprite-arch:
    name: Build Aseprite for Arch Linux
    runs-on: ubuntu-latest
    steps:
      # Step 1: Securely download and unzip Skia outside the container where GitHub native networking works perfectly
      - name: Fetch and Extract Precompiled Skia Binaries
        run: |
          mkdir -p ${{ github.workspace }}/skia
          cd ${{ github.workspace }}/skia
          curl -L "https://github.com" -o skia.zip
          unzip skia.zip
          rm skia.zip

      # Step 2: Now hand execution over to the Arch Linux workspace container
      - name: Build inside Arch Linux Environment
        uses: addnab/docker-run-action@v3
        with:
          image: archlinux:latest
          options: -v ${{ github.workspace }}:/__w/pixelart/pixelart
          run: |
            # 1. Update system and get exact toolchain packages matching your native environment
            pacman -Syu --noconfirm
            pacman -S --noconfirm base-devel cmake ninja git libx11 libxcursor libxi libxrandr \
              mesa libglvnd fontconfig pixman freetype2 harfbuzz zlib libxfixes libxinerama \
              libxcomposite gtk3 gdk-pixbuf2 cairo pango atk p7zip clang

            # 2. Pull the exact release tag
            git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite.git --branch ${{ env.ASEPRITE_VERSION }} aseprite
            
            cd aseprite
            git submodule update --init --recursive

            # 3. Compile passing explicit direct absolute paths to the compiled libskia.a file
            export CC=clang
            export CXX=clang++
            
            cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
              -DENABLE_TESTS=OFF \
              -DENABLE_SCRIPTING=ON \
              -DENABLE_CCACHE=OFF \
              -DLAF_BACKEND=skia \
              -DSKIA_DIR=/__w/pixelart/pixelart/skia \
              -DSKIA_LIBRARY_DIR=/__w/pixelart/pixelart/skia/out/Release-x64 \
              -DSKIA_LIBRARY=/__w/pixelart/pixelart/skia/out/Release-x64/libskia.a \
              -DOPENSSL_USE_STATIC_LIBS=ON

            cd build && ninja -j$(nproc)

            # 4. Clean up the installation folder inside binary tree
            cd bin
            find . -mindepth 1 ! \( -name 'aseprite' -o -name 'data' -prune \) -exec rm -rf {} +
            
            echo '# Portable Flag configuration' > aseprite.ini
            chmod +x aseprite
            
            cat > Aseprite.sh << 'EOF'
            #!/bin/bash
            SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE}")" && pwd)"
            cd "$SCRIPT_DIR"
            ./aseprite "$@"
            EOF
            chmod +x Aseprite.sh
            
            7z a /__w/pixelart/pixelart/Aseprite-${{ env.ASEPRITE_VERSION }}-ArchLinux.zip *

      # Step 3: Export the compiled zip folder back to your action interface
      - name: Export Application Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-${{ env.ASEPRITE_VERSION }}-ArchLinux
          path: ${{ github.workspace }}/Aseprite-${{ env.ASEPRITE_VERSION }}-ArchLinux.zip
